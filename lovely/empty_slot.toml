[manifest]
version = "1.0.0"
dump_lua = true
priority = 0

[[patches]]
[patches.pattern]
target = "card.lua"
pattern = "if G.jokers.cards[i].ability.name == 'Joker Stencil' then self.ability.x_mult = self.ability.x_mult + 1 end"
position = "after"
match_indent = true
payload = '''
    if G.jokers.cards[i].config and G.jokers.cards[i].config.center and G.jokers.cards[i].config.center.mngy_empty then self.ability.x_mult = self.ability.x_mult + 1 end
'''

[[patches]]
[patches.pattern]
target = "functions/common_events.lua"
pattern = "if not hide_desc and card and card.ability and (card.ability.extra_slots_used or 0) ~= 0 then"
position = "before"
match_indent = true
payload = '''
    if not hide_desc and card and card.config and card.config.center and card.config.center.mngy_empty then
        info_queue[#info_queue + 1] = {set = 'Other', key = 'mngy_empty'}
    end
'''
