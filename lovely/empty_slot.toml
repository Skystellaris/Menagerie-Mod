[manifest]
version = "1.0.0"
dump_lua = true
priority = 0

[[patches]]
[patches.pattern]
target = "card.lua"
pattern = "if G.jokers.cards[i].ability.name == 'Joker Stencil' then self.ability.x_mult = self.ability.x_mult + 1 end"
position = "after"
match_indent = true
payload = '''
    if G.jokers.cards[i].config.center_key == 'j_mngy_swiss_cheese' then self.ability.x_mult = self.ability.x_mult + 1 end
    if G.jokers.cards[i].config.center_key == 'j_mngy_missing' then self.ability.x_mult = self.ability.x_mult + 1 end
    if G.jokers.cards[i].config.center_key == 'j_mngy_punch_card' then self.ability.x_mult = self.ability.x_mult + 1 end
'''